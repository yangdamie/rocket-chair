<!doctype html>
<html lang="en">

  <title>Rocket Chair</title>
  <style>
    :root{--cream:#f4dfad;--wine:#7c2432;--gold:#d4a33c;--brown:#3d211b;--green:#80977b;--ink:#241614}
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:#211512;color:var(--cream);font-family:"Courier New",monospace}
    body{display:grid;place-items:center;min-height:100svh;background:radial-gradient(circle at 50% 10%,#72402d 0,#2b1915 48%,#130d0b 100%)}
    button{font:inherit}.game-shell{position:relative;width:min(100vw,760px);min-height:100svh;background:#201310;overflow:hidden}
    .brand{height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 15px;background:#371c18;border-bottom:3px solid #b78231;letter-spacing:.12em}.brand b{font-family:Georgia,serif;font-size:21px;color:#ffe5a0}.brand span{font-size:10px;color:#caa76a}.sound{width:42px;height:32px;border:3px solid #b78231;background:#ead7a5;color:#7c2432;font-size:18px;font-weight:900;box-shadow:3px 3px #1a0e0c;cursor:pointer}.sound.off{background:#4d2921;color:#caa76a;opacity:.82}
    .hud{height:64px;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:7px;padding:7px;background:#4f2a20}.hud-box{display:grid;place-items:center;padding:4px 7px;border:2px solid #9a6d2b;background:#ead7a5;color:#4a2a20;box-shadow:inset 0 0 0 2px #c99d50}.hud-box small{font-size:9px;font-weight:900;letter-spacing:.13em}.hud-box b{font-size:15px;color:var(--wine)}
    .briefcase{display:grid;grid-template-columns:54px 1fr;gap:6px;align-items:center}.case-icon{display:block;width:52px;height:40px;image-rendering:pixelated}.case-copy{text-align:left}.case-copy b{display:block}.case-copy small{display:block}.life{display:flex;gap:4px;margin-top:3px}.life i{width:18px;height:10px;border:2px solid #2d1713;background:#b8132f;box-shadow:inset 0 0 0 2px #ffd45a,0 0 0 1px #7c2432}.life i.empty{background:#2d2622;border-color:#15100e;box-shadow:inset 0 0 0 2px #6f6252}
    .stage{position:relative;width:100%;aspect-ratio:3/4;background:#91a68e;overflow:hidden}.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.story-video{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:4}.story-video.playing{display:block;opacity:0;pointer-events:none}
    .overlay{position:absolute;inset:0;display:grid;place-items:end center;padding:22px;background:linear-gradient(transparent 48%,rgba(25,14,12,.72));transition:opacity .2s}.overlay.hidden{display:none;opacity:0;pointer-events:none}.start-card{width:min(440px,94%);padding:13px;text-align:center;background:rgba(244,223,173,.94);border:4px solid #4c2a20;box-shadow:6px 6px #241411;color:#41241d}.start-card p{margin:0 0 10px;font-weight:900;font-size:13px;letter-spacing:.08em}.primary{min-height:48px;padding:10px 24px;border:4px solid #4b281f;background:var(--wine);color:#ffe6a4;font-weight:900;letter-spacing:.11em;box-shadow:4px 4px #8b672c;cursor:pointer}.primary:active{transform:translate(3px,3px);box-shadow:1px 1px #8b672c}
    .touch-controls{height:70px;display:flex;gap:9px;padding:9px;background:#432219;border-top:3px solid #b78231}.touch{flex:1;border:3px solid #c0903e;background:#e6d29e;color:#4e2d22;font-size:18px;font-weight:900;box-shadow:inset 0 0 0 2px #765229;touch-action:none}.pause{flex:0 0 58px;background:#772836;color:#ffe6a4}
    .help{padding:7px 12px 10px;text-align:center;background:#2b1814;color:#d4b980;font-size:10px;letter-spacing:.08em}
    .result{place-items:center;padding:15px;background:rgba(22,13,12,.9)}.result-card{width:min(500px,96%);max-height:96%;overflow:auto;padding:16px;text-align:center;background:#f0dcaa;border:5px solid #5a3023;box-shadow:7px 7px #120b09;color:#3f251e}.result-card h2{margin:3px auto 9px;max-width:100%;color:var(--wine);font-family:Georgia,serif;font-size:clamp(21px,5.4vw,35px);line-height:1.02;overflow-wrap:anywhere}.eyebrow{margin:0;color:#845027;font-size:9px;font-weight:900;letter-spacing:.14em}.game-over-mode .result-card{background:#f2d999;border-color:#3c2019;box-shadow:8px 8px #120b09,0 0 0 5px #9b2938 inset}.game-over-mode .eyebrow{display:inline-block;margin:0 auto 7px;padding:7px 12px;background:#8f2737;color:#ffe8a5;border:4px solid #3d211b;font-size:clamp(26px,8vw,52px);font-family:Georgia,serif;line-height:.9;letter-spacing:.08em;text-shadow:3px 0 #2b1713,-3px 0 #2b1713,0 3px #2b1713,4px 4px #d0a03e;transform:rotate(-2deg);animation:boom .7s steps(2,end) infinite}.game-over-mode .result-card h2{font-size:clamp(20px,5vw,32px);color:#5a3023;text-shadow:none}.gameover-title{font-size:clamp(34px,10vw,58px);letter-spacing:.08em;text-shadow:4px 4px #d1a04a}.gameover-copy{margin:8px 0 14px;font-weight:900;font-size:12px;line-height:1.5;letter-spacing:.08em}.end-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.end-actions .primary{min-width:150px}.chair-frame{width:220px;height:220px;margin:auto;background:#dac487;border:3px solid #79502c}.chair-frame canvas{width:100%;height:100%;image-rendering:pixelated}.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:10px 0}.result-stats div{padding:7px 3px;border:2px solid #846036;background:#deca91}.result-stats small{display:block;font-size:8px}.result-stats b{display:block;margin-top:3px;color:var(--wine);font-size:12px}.traits{margin:8px 0 12px;font-size:10px;line-height:1.55;color:#684529}
    .hit{animation:hit .22s steps(2) 3}@keyframes hit{50%{filter:sepia(1) saturate(6) hue-rotate(315deg);transform:translateX(5px)}}@keyframes boom{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
    @media(min-width:761px){.game-shell{min-height:auto;margin:18px;border:6px solid #5b3425;outline:3px solid #b78231;box-shadow:0 18px 60px #000b}.stage{max-height:76vh}.touch-controls{height:58px}.touch{font-size:14px}}
    @media(max-width:520px){.touch-controls{display:none}.brand{height:46px}.brand b{font-size:18px}.brand span{display:none}.sound{width:38px;height:28px}.hud{height:60px;padding:5px}.hud-box b{font-size:13px}.stage{height:calc(100svh - 176px);aspect-ratio:auto}.help{display:none}.touch-controls{height:70px}.result-card{padding:11px}.chair-frame{width:190px;height:190px}}
  </style>
</head>
<body>
  <!-- Rocket Chair gameplay build: richer chair silhouettes and progressive acceleration -->
  <main class="game-shell">
    <header class="brand"><b>ROCKET CHAIR</b><span>THE MUTUAL FUN · FAN GAME</span><button class="sound" id="sound" aria-label="Sound on">🔊</button></header>
    <section class="hud">
      <div class="hud-box"><small>ALTITUDE</small><b id="altitude">0 KM</b></div>
      <div class="hud-box briefcase"><svg class="case-icon" viewBox="0 0 64 48" role="img" aria-label="Treasure chest"><path fill="#2b1914" d="M12 3h40v2h4v15h3v4H5v-4h3V5h4zM6 20h52v2h3v19h-3v3H6v-3H3V22h3z"/><path fill="#70442b" d="M13 7h38v10H13zM8 24h48v15H8z"/><path fill="#9a5830" d="M15 9h34v7H15zM10 26h44v11H10z"/><path fill="#c17b35" d="M13 5h38v2H13zM6 20h52v3H6zM8 39h48v2H8z"/><path fill="#f1b933" d="M15 21h7v-5h7v5h5v-7h7v7h5v-4h7v6H9v-2h6zM17 15h5V9h7v7h-3v4h-9zM35 15h6V9h7v8h-3v3h-7v-3h-3z"/><path fill="#ffe16b" d="M18 10h3v5h-3zM37 10h3v4h-3zM29 18h4v3h-4z"/><path fill="#d9912d" d="M12 27h40v2H12zM15 34h34v2H15z"/><path fill="#f4bd39" d="M29 23h7v8h-7z"/><path fill="#ffe77e" d="M31 25h3v4h-3z"/></svg><div class="case-copy"><small>COINS</small><b id="coins">0 COINS</b></div></div>
      <div class="hud-box"><small id="timeLabel">LIVES</small><b id="time">3</b><div class="life" id="life"><i></i><i></i><i></i></div></div>
    </section>
    <section class="stage" id="stage">
      <canvas id="game" width="720" height="960" aria-label="Rocket Chair game"></canvas><video id="storyVideo" class="story-video" playsinline preload="auto" src="assets/story-intro-clean.mp4?v=4"></video>
      <div class="overlay" id="intro"><div class="start-card"><p>COLLECT COINS. AVOID FILE FOLDERS.<br>THREE HITS WILL END YOUR FLIGHT.</p><button class="primary" id="start">START FLIGHT</button></div></div>
      <div class="overlay result hidden" id="result">
        <div class="result-card">
          <p class="eyebrow" id="resultEyebrow">YOUR FLIGHT HAS FORGED</p>
          <h2 id="chairName">THE FIRST MOVER</h2>
          <div class="chair-frame"><canvas id="chair" width="220" height="220"></canvas></div>
          <div class="result-stats"><div><small>COINS</small><b id="rCoins">0</b></div><div><small>ALTITUDE</small><b id="rAltitude">0 KM</b></div><div><small>PATH ID</small><b id="rPath">000000</b></div></div>
          <div class="traits" id="traits"></div>
          <button class="primary" id="again">FLY AGAIN</button>
        </div>
      </div>
    </section>
    <section class="touch-controls">
      <button class="touch" data-dir="-1" aria-label="Move left">A / ◀</button>
      <button class="touch pause" id="pause" aria-label="Pause">Ⅱ</button>
      <button class="touch" data-dir="1" aria-label="Move right">▶ / D</button>
    </section>
    <div class="help">DESKTOP: A / D OR ← / → · MOBILE: HOLD BUTTONS OR DRAG THE SEAT</div>
  </main>
  <script>
    const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),stage=$('stage');
    ctx.imageSmoothingEnabled=false;
    const office=new Image();office.src='assets/office-start-new.png';
    const launchScene=new Image();launchScene.src='assets/office-roof-intact.png';
    const pilot=new Image();pilot.src='assets/new-flight-character.png';
    const originalPilot=pilot;
    const ui={alt:$('altitude'),coins:$('coins'),time:$('time'),life:$('life'),intro:$('intro'),result:$('result'),sound:$('sound'),storyVideo:$('storyVideo')};ui.storyVideo.addEventListener('ended',()=>{storyPlaying=false;ui.storyVideo.classList.remove('playing');roofBridge=0;elapsed=launchDuration;startRocket();startPanicLoop();});
    const params=new URLSearchParams(location.search),keys={left:false,right:false},launchDuration=4.8,flightDuration=120,endlessMode=true,steadyMode=params.get('steady')==='1';
    let storyPlaying=false,roofBridge=0,running=false,paused=false,last=0,elapsed=0,playerX=360,playerLane=1,coinCount=0,fileHits=0,altitude=0,slow=0,spawnClock=0,objects=[],path=[],shake=0,pendingResult=null,endTimer=null,soundOn=true,audioCtx=null,rocketOsc=null,rocketNoise=null,rocketGain=null,rocketFilter=null,rocketAirFilter=null,rocketLfo=null,rocketLfoGain=null,rocketOsc2=null,panicOsc=null,panicGain=null,panicVib=null,panicVibGain=null,panicFormants=[];
    const stars=Array.from({length:70},()=>({x:Math.random()*720,y:Math.random()*960,s:1+Math.floor(Math.random()*3),v:45+Math.random()*90}));
    office.onload=()=>{if(!running)draw()};
    function ensureAudio(){if(!soundOn)return null;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
    function tone(freq=440,dur=.08,type='square',vol=.05){if(!soundOn)return;try{const ac=ensureAudio();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.stop(ac.currentTime+dur)}catch(e){}}
    function connectAhVoice(ac,source,out,scale=1){panicFormants=[];[[780,10,.75],[1180,8,.55],[2650,7,.32]].forEach(([freq,q,gain])=>{const f=ac.createBiquadFilter(),fg=ac.createGain();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;fg.gain.value=gain*scale;source.connect(f);f.connect(fg);fg.connect(out);panicFormants.push(f)})}
    function panicYelp(big=false){if(!soundOn)return;try{const ac=ensureAudio();if(!ac)return;const now=ac.currentTime,o=ac.createOscillator(),vib=ac.createOscillator(),vg=ac.createGain(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(big?260:300,now);o.frequency.exponentialRampToValueAtTime(big?620:520,now+(big?.16:.13));o.frequency.exponentialRampToValueAtTime(big?360:390,now+(big?.46:.32));vib.type='sine';vib.frequency.value=big?15:12;vg.gain.value=big?55:38;g.gain.setValueAtTime(.001,now);g.gain.linearRampToValueAtTime(big?.11:.075,now+.04);g.gain.exponentialRampToValueAtTime(.001,now+(big?.58:.42));vib.connect(vg);vg.connect(o.frequency);connectAhVoice(ac,o,g,big?1.15:.9);g.connect(ac.destination);vib.start(now);o.start(now);vib.stop(now+(big?.6:.44));o.stop(now+(big?.6:.44))}catch(e){}}
    function startPanicLoop(){if(!soundOn||panicGain)return;try{const ac=ensureAudio();if(!ac)return;panicOsc=ac.createOscillator();panicGain=ac.createGain();panicVib=ac.createOscillator();panicVibGain=ac.createGain();panicOsc.type='sawtooth';panicOsc.frequency.value=310;panicVib.type='sine';panicVib.frequency.value=9.5;panicVibGain.gain.value=42;panicGain.gain.value=.001;panicVib.connect(panicVibGain);panicVibGain.connect(panicOsc.frequency);connectAhVoice(ac,panicOsc,panicGain,1);panicGain.connect(ac.destination);panicOsc.start();panicVib.start();panicGain.gain.linearRampToValueAtTime(.062,ac.currentTime+.2)}catch(e){stopPanicLoop()}}
    function updatePanicLoop(){if(!panicGain||!audioCtx)return;const p=Math.max(0,Math.min(1,flightTime()/flightDuration));panicGain.gain.setTargetAtTime(.055+p*.018,audioCtx.currentTime,.1);if(panicOsc)panicOsc.frequency.setTargetAtTime(300+p*70,audioCtx.currentTime,.2);if(panicVib)panicVib.frequency.setTargetAtTime(9+p*5,audioCtx.currentTime,.2);if(panicFormants[0])panicFormants[0].frequency.setTargetAtTime(760+p*90,audioCtx.currentTime,.25);if(panicFormants[1])panicFormants[1].frequency.setTargetAtTime(1160+p*120,audioCtx.currentTime,.25)}
    function stopPanicLoop(){try{if(panicGain&&audioCtx)panicGain.gain.setTargetAtTime(.001,audioCtx.currentTime,.04);if(panicOsc)panicOsc.stop(audioCtx.currentTime+.12);if(panicVib)panicVib.stop(audioCtx.currentTime+.12)}catch(e){}panicOsc=null;panicGain=null;panicVib=null;panicVibGain=null;panicFormants=[]}
    function launchWhoosh(){if(!soundOn)return;try{const ac=ensureAudio();if(!ac)return;const now=ac.currentTime,osc=ac.createOscillator(),og=ac.createGain(),noise=ac.createBufferSource(),filter=ac.createBiquadFilter(),ng=ac.createGain(),buffer=ac.createBuffer(1,ac.sampleRate*.9,ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++){const t=i/data.length;data[i]=(Math.random()*2-1)*(1-t)}osc.type='sine';osc.frequency.setValueAtTime(180,now);osc.frequency.exponentialRampToValueAtTime(920,now+.62);og.gain.setValueAtTime(.001,now);og.gain.linearRampToValueAtTime(.055,now+.16);og.gain.exponentialRampToValueAtTime(.001,now+.82);noise.buffer=buffer;filter.type='bandpass';filter.frequency.setValueAtTime(700,now);filter.frequency.exponentialRampToValueAtTime(3600,now+.68);filter.Q.value=.9;ng.gain.setValueAtTime(.001,now);ng.gain.linearRampToValueAtTime(.075,now+.1);ng.gain.exponentialRampToValueAtTime(.001,now+.82);osc.connect(og);og.connect(ac.destination);noise.connect(filter);filter.connect(ng);ng.connect(ac.destination);osc.start(now);noise.start(now);osc.stop(now+.86);noise.stop(now+.86)}catch(e){}}
    function startRocket(){if(!soundOn||rocketGain)return;try{const ac=ensureAudio();if(!ac)return;rocketGain=ac.createGain();rocketFilter=ac.createBiquadFilter();rocketOsc=ac.createOscillator();rocketOsc2=ac.createOscillator();rocketLfo=ac.createOscillator();rocketLfoGain=ac.createGain();rocketFilter.type='lowpass';rocketFilter.frequency.value=1200;rocketOsc.type='triangle';rocketOsc.frequency.value=155;rocketOsc2.type='sine';rocketOsc2.frequency.value=232;rocketLfo.type='sine';rocketLfo.frequency.value=5.2;rocketLfoGain.gain.value=.018;rocketGain.gain.value=.001;rocketOsc.connect(rocketFilter);rocketOsc2.connect(rocketFilter);rocketFilter.connect(rocketGain);rocketLfo.connect(rocketLfoGain);rocketLfoGain.connect(rocketGain.gain);rocketGain.connect(ac.destination);rocketOsc.start();rocketOsc2.start();rocketLfo.start();rocketGain.gain.linearRampToValueAtTime(.05,ac.currentTime+.25)}catch(e){stopRocket()}}
    function updateRocket(){if(!rocketGain||!audioCtx)return;const p=Math.max(0,Math.min(1,flightTime()/flightDuration)),base=155+p*45,v=slow>0?.026:.05+p*.018;rocketGain.gain.setTargetAtTime(v,audioCtx.currentTime,.1);if(rocketOsc)rocketOsc.frequency.setTargetAtTime(base,audioCtx.currentTime,.14);if(rocketOsc2)rocketOsc2.frequency.setTargetAtTime(base*1.5,audioCtx.currentTime,.14);if(rocketFilter)rocketFilter.frequency.setTargetAtTime(1050+p*650,audioCtx.currentTime,.2);if(rocketLfo)rocketLfo.frequency.setTargetAtTime(4.8+p*1.8,audioCtx.currentTime,.18)}
    function stopRocket(){try{if(rocketGain&&audioCtx)rocketGain.gain.setTargetAtTime(.001,audioCtx.currentTime,.04);if(rocketNoise)rocketNoise.stop(audioCtx.currentTime+.14);if(rocketLfo)rocketLfo.stop(audioCtx.currentTime+.14);if(rocketOsc)rocketOsc.stop(audioCtx.currentTime+.14);if(rocketOsc2)rocketOsc2.stop(audioCtx.currentTime+.14)}catch(e){}rocketOsc=null;rocketOsc2=null;rocketNoise=null;rocketGain=null;rocketFilter=null;rocketAirFilter=null;rocketLfo=null;rocketLfoGain=null}
    function updateSound(){ui.sound.textContent=soundOn?'🔊':'🔇';ui.sound.classList.toggle('off',!soundOn);ui.sound.setAttribute('aria-label',soundOn?'Sound on':'Sound off');if(!soundOn){stopRocket();stopPanicLoop()}else if(running&&!paused&&elapsed>=launchDuration){startRocket();startPanicLoop()}}
    function reset(){try{localStorage.setItem('seatFlightRun',String(Number(localStorage.getItem('seatFlightRun')||0)+1))}catch(e){}storyPlaying=true;ui.storyVideo.classList.add('playing');ui.storyVideo.currentTime=0;ui.storyVideo.play().catch(()=>{});if(endTimer)clearTimeout(endTimer);stopRocket();stopPanicLoop();ensureAudio();running=true;paused=false;last=performance.now();elapsed=0;playerLane=1;playerX=360;coinCount=0;fileHits=0;altitude=0;slow=0;spawnClock=.35;objects=[];path=[];shake=0;pendingResult=null;keys.left=keys.right=false;ui.intro.classList.add('hidden');ui.result.classList.add('hidden');$('pause').textContent='Ⅱ';updateUI();if(!endlessMode)endTimer=setTimeout(()=>{if(running)finish('time')},(launchDuration+flightDuration+.4)*1000);requestAnimationFrame(loop)}
    function flightTime(){return Math.max(0,elapsed-launchDuration)}
    function updateUI(){const ft=flightTime(),remain=Math.max(0,flightDuration-ft);ui.alt.textContent=Math.floor(altitude)+' KM';ui.coins.textContent=coinCount+' COINS';[...ui.life.children].forEach((b,i)=>b.classList.toggle('empty',i<fileHits));ui.time.textContent=Math.max(0,3-fileHits)}
    function spawn(){const isCoin=Math.random()<.58,lanes=[190,360,530],x=lanes[Math.floor(Math.random()*lanes.length)];objects.push({type:isCoin?'coin':'file',x,y:-55,v:285+Math.random()*105,phase:Math.random()*6.28,hit:false})}
    function update(dt){if(storyPlaying)return;if(roofBridge>0){roofBridge-=dt;elapsed=launchDuration*(1-Math.max(0,roofBridge)/1.1);if(roofBridge<=0)elapsed=launchDuration;return}elapsed+=dt;if(elapsed<launchDuration){updateUI();return}if(soundOn&&!rocketGain)startRocket();if(soundOn&&!panicGain)startPanicLoop();updateRocket();updatePanicLoop();const progress=Math.min(1,flightTime()/(endlessMode?60:flightDuration)),pace=1.78+Math.min(1.1,coinCount*.035)+Math.pow(progress,1.15)*1.65,speed=pace*(slow>0 ? .5 : 1);if(slow>0)slow-=dt;altitude+=dt*4.5*speed;spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=Math.max(.23,.46-progress*.22-coinCount*.0015)+Math.random()*.12}
      for(const s of stars){s.y+=s.v*dt*speed;if(s.y>970){s.y=-8;s.x=Math.random()*720}}
      for(const o of objects){o.y+=o.v*dt*speed;o.phase+=dt*4;const dx=o.x-playerX,dy=o.y-735;if(dx*dx+dy*dy<(o.type==='coin'?56*56:62*62)){if(o.type==='coin'){coinCount++;altitude+=1.3;tone(980,.06,'square',.035)}else{fileHits++;slow=1.15;shake=.65;tone(140,.18,'sawtooth',.08);stage.classList.remove('hit');void stage.offsetWidth;stage.classList.add('hit');if(fileHits>=3){o.hit=true;updateUI();finish('files');return}}o.hit=true}else if(o.y>1010)o.hit=true}objects=objects.filter(o=>!o.hit);
      if(Math.floor(flightTime()*5)>path.length)path.push(Math.round(playerX));if(shake>0)shake-=dt;updateUI();if(!endlessMode&&flightTime()>=flightDuration)finish()}
